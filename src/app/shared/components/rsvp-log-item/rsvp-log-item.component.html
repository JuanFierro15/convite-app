<ion-item
  [routerLink]="link()"
  [detail]="false"
  button
  lines="full"
  [attr.aria-label]="ariaLabel()"
>
  <ion-icon
    slot="start"
    [name]="iconName()"
    [color]="iconColor()"
    aria-hidden="true"
  ></ion-icon>
  <ion-label>
    <h3 class="text-name">
      <strong>{{ entry().guest_name }}</strong> {{ actionText() }}
    </h3>
    <p class="text-label">{{ detailText() }}</p>
  </ion-label>
</ion-item>
